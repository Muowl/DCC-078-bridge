<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagrama UML - Bridge</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #ffffff; }
        svg { display: block; width: 1280px; max-width: 100%; height: auto; }
        .nome { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; fill: #2d3142; }
        .membro { font-family: Consolas, monospace; font-size: 9px; fill: #2d3142; }
        .tag { font-family: Consolas, monospace; font-size: 8px; text-anchor: middle; fill: #4f5d75; }
    </style>
</head>
<body>
<svg viewBox="0 40 1280 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagrama-uml-title diagrama-uml-desc">
    <title id="diagrama-uml-title">Diagrama de classes do padrão Bridge</title>
    <desc id="diagrama-uml-desc">CentralNotificacoes utiliza Notificacao, cujas subclasses de agendamento e cancelamento delegam o envio à interface CanalEnvio, implementada por CanalEmail e CanalSms.</desc>
    <defs>
        <marker id="heranca" markerWidth="16" markerHeight="12" refX="16" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0,16 6,0 12" fill="#ffffff" stroke="#2d3142"/></marker>
        <marker id="associacao" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8" fill="none" stroke="#4f5d75"/></marker>
    </defs>
    <rect width="1280" height="720" fill="#ffffff"/>

    <!-- Associações: referências recebidas por construtor, sem posse exclusiva. -->
    <line x1="248" y1="172" x2="248" y2="256" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <line x1="560" y1="308" x2="760" y2="308" stroke="#4f5d75" marker-end="url(#associacao)"/>
    <!-- Herança entre abstração e abstrações refinadas. -->
    <line x1="200" y1="476" x2="200" y2="396" stroke="#2d3142" marker-end="url(#heranca)"/>
    <path d="M560 476 V448 Q560 440 552 440 H448 Q440 440 440 432 V396" fill="none" stroke="#2d3142" marker-end="url(#heranca)"/>
    <!-- Realização: canais concretos implementam a interface. -->
    <path d="M864 476 V412 Q864 404 856 404 H840 Q832 404 832 396 V348" fill="none" stroke="#2d3142" stroke-dasharray="5,4" marker-end="url(#heranca)"/>
    <path d="M1120 476 V420 Q1120 412 1112 412 H1088 Q1080 412 1080 404 V348" fill="none" stroke="#2d3142" stroke-dasharray="5,4" marker-end="url(#heranca)"/>
    <!-- Multiplicidades e rótulo, com máscaras afastadas dos conectores. -->
    <rect x="260" y="184" width="44" height="12" fill="#ffffff"/><text x="264" y="193" class="membro">0..*</text>
    <rect x="260" y="232" width="20" height="12" fill="#ffffff"/><text x="264" y="241" class="membro">1</text>
    <rect x="572" y="320" width="44" height="12" fill="#ffffff"/><text x="576" y="329" class="membro">0..*</text>
    <rect x="732" y="320" width="20" height="12" fill="#ffffff"/><text x="736" y="329" class="membro">1</text>
    <rect x="620" y="284" width="80" height="16" fill="#ffffff"/><text x="660" y="295" class="tag">canalEnvio</text>

    <g id="central-notificacoes">
        <rect x="80" y="80" width="340" height="92" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M86 80 H414 Q420 80 420 86 V120 H80 V86 Q80 80 86 80" fill="#f1f3f5"/>
        <text x="250" y="104" class="nome">CentralNotificacoes</text>
        <line x1="80" y1="120" x2="420" y2="120" stroke="#bfc0c0"/>
        <text x="96" y="139" class="membro">- notificacao: Notificacao {readOnly}</text>
        <line x1="80" y1="148" x2="420" y2="148" stroke="#bfc0c0"/>
        <text x="96" y="164" class="membro">+ notificar(String, String): String</text>
    </g>
    <g id="notificacao">
        <rect x="80" y="256" width="480" height="140" rx="6" fill="#ffffff"/>
        <rect x="80" y="256" width="480" height="140" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
        <path d="M86 256 H554 Q560 256 560 262 V316 H80 V262 Q80 256 86 256" fill="#fff1eb"/>
        <text x="320" y="300" class="nome" font-style="italic">Notificacao</text>
        <line x1="80" y1="316" x2="560" y2="316" stroke="#bfc0c0"/>
        <text x="96" y="340" class="membro"># canalEnvio: CanalEnvio {readOnly}</text>
        <line x1="80" y1="356" x2="560" y2="356" stroke="#bfc0c0"/>
        <text x="96" y="380" class="membro" font-style="italic">+ enviar(destinatario: String, servico: String): String</text>
    </g>
    <g id="canal-envio">
        <rect x="760" y="256" width="440" height="92" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M766 256 H1194 Q1200 256 1200 262 V312 H760 V262 Q760 256 766 256" fill="#f1f3f5"/>
        <text x="980" y="278" class="tag">«interface»</text>
        <text x="980" y="298" class="nome">CanalEnvio</text>
        <line x1="760" y1="312" x2="1200" y2="312" stroke="#bfc0c0"/>
        <text x="776" y="336" class="membro">+ enviar(destinatario: String, mensagem: String): String</text>
    </g>
    <g id="notificacao-agendamento">
        <rect x="40" y="476" width="320" height="108" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M46 476 H354 Q360 476 360 482 V536 H40 V482 Q40 476 46 476" fill="#f1f3f5"/>
        <text x="200" y="520" class="nome">NotificacaoAgendamento</text>
        <line x1="40" y1="536" x2="360" y2="536" stroke="#bfc0c0"/>
        <text x="56" y="560" class="membro">+ enviar(String, String): String</text>
    </g>
    <g id="notificacao-cancelamento">
        <rect x="400" y="476" width="320" height="108" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M406 476 H714 Q720 476 720 482 V536 H400 V482 Q400 476 406 476" fill="#f1f3f5"/>
        <text x="560" y="520" class="nome">NotificacaoCancelamento</text>
        <line x1="400" y1="536" x2="720" y2="536" stroke="#bfc0c0"/>
        <text x="416" y="560" class="membro">+ enviar(String, String): String</text>
    </g>
    <g id="canal-email">
        <rect x="768" y="476" width="208" height="76" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M774 476 H970 Q976 476 976 482 V520 H768 V482 Q768 476 774 476" fill="#f1f3f5"/>
        <text x="872" y="504" class="nome">CanalEmail</text>
        <line x1="768" y1="520" x2="976" y2="520" stroke="#bfc0c0"/>
        <text x="784" y="540" class="membro">+ enviar(String, String): String</text>
    </g>
    <g id="canal-sms">
        <rect x="1016" y="476" width="208" height="76" rx="6" fill="#ffffff" stroke="#2d3142"/>
        <path d="M1022 476 H1218 Q1224 476 1224 482 V520 H1016 V482 Q1016 476 1022 476" fill="#f1f3f5"/>
        <text x="1120" y="504" class="nome">CanalSms</text>
        <line x1="1016" y1="520" x2="1224" y2="520" stroke="#bfc0c0"/>
        <text x="1032" y="540" class="membro">+ enviar(String, String): String</text>
    </g>

</svg>
</body>
</html>
